
name: Build SQL Project

on:
  workflow_call: 
    inputs:
      configuration:
        type: string
        default: "Debug"
        description: "SQL project should build in debug or release"


jobs:
  build_and_test:
    runs-on: windows-latest
    env:
      DB_USER: ${{ vars.LOCAL_MSSQL_SA_USERNAME }}
      DB_PASS: ${{ secrets.LOCAL_MSSQL_SA_PASSWORD }}

      BankingDB_LinkServerName: ${{ vars.BankingDB_LinkServerName }}
      BankingDB: "Server=localhost;Database=BankingDB;User Id=${{ vars.LOCAL_MSSQL_SA_USERNAME }};Password=${{ secrets.LOCAL_MSSQL_SA_PASSWORD }};TrustServerCertificate=True;"
      ReportingDB: "Server=localhost;Database=ReportingDB;User Id=${{ vars.LOCAL_MSSQL_SA_USERNAME }};Password=${{ secrets.LOCAL_MSSQL_SA_PASSWORD }};TrustServerCertificate=True;"

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Build Banking DB"
        uses: './.github/actions/buildSQLProject'
        with:
          projectName: "BankingDB"
          configuration: "Debug"

      - name: "Build Reporting DB"
        uses: './.github/actions/buildSQLProject'
        with:
          projectName: "ReportingDB"
          configuration: "Debug"
          buildProperties: "/p:BankingDatabaseName=BankingDB"
          
      - name: Install a SQL Server suite of tools
        uses: potatoqualitee/mssqlsuite@v2
        with:
          install: sqlengine, sqlpackage
          sa-password: ${{ secrets.LOCAL_MSSQL_SA_PASSWORD }}
          admin-username: ${{ vars.LOCAL_MSSQL_SA_USERNAME }}
          
      - name: Verify SQL Server Connection
        run: sqlcmd -S localhost -U $env:DB_USER -P $env:DB_PASS -C -Q "SELECT @@VERSION"
      
      - name: Apply BankingDB DACPAC
        uses: './.github/actions/publishDacpac'
        with:
          projectName: "BankingDB"
          dbName: "BankingDB"

      - name: Apply ReportingDB DACPAC
        uses: './.github/actions/publishDacpac'
        with:
          projectName: "ReportingDB"
          dbName: "ReportingDB"
          serverVariables: '/v:BankingDB="BankingDB" /v:BankingDBServer="${{env.BankingDB_LinkServerName}}"'
      
      - name: "Build and Test Testing project"
        run: |
          dotnet build DataBaseTests/DataBaseTests.csproj
          dotnet test DataBaseTests/DataBaseTests.csproj --no-build
