
name: Build SQL Project

on:
  workflow_call: 
    inputs:
      configuration:
        type: string
        default: "Debug"
        description: "SQL project should build in debug or release"


jobs:
  build_and_test:
    runs-on: windows-latest

    steps:
      - name: Install a SQL Server suite of tools
        uses: potatoqualitee/mssqlsuite@v2
        with:
          install: sqlengine, sqlpackage
          sa-password: '${{secrets.MSSQL_SA_PASSWORD}}'
          admin-username: '${{secrets.MSSQL_SA_USERNAME}}'

      - name: Verify SQL Server Connection
        run: sqlcmd -S localhost -U ${{secrets.MSSQL_SA_USERNAME}} -P ${{secrets.MSSQL_SA_PASSWORD}} -C -Q "SELECT @@VERSION"

      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Build Banking DB"
        uses: './.github/actions/buildProject'
        with:
          projectName: "BankingDB"
          configuration: "Debug"

      - name: "Build Reporting DB"
        uses: './.github/actions/buildProject'
        with:
          projectName: "ReportingDB"
          configuration: "Debug"
          buildProperties: "/p:BankingDatabaseName=BankingDB"

      - name: "Debug"
        run: tree

