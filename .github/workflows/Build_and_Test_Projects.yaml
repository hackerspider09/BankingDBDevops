
name: Build SQL Project

on:
  workflow_call: 
    inputs:
      configuration:
        type: string
        default: "Debug"
        description: "SQL project should build in debug or release"


jobs:
  build_and_test:
    runs-on: windows-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{secrets.MSSQL_SA_PASSWORD}} 
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U ${{secrets.MSSQL_SA_USERNAME}} -P ${{secrets.MSSQL_SA_PASSWORD}} -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Verify SQL Server Connection
        run: |
          /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P YourStrong!Password123 -C -Q "SELECT @@VERSION"

      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Build Banking DB"
        uses: './.github/actions/buildProject'
        with:
          projectName: "BankingDB"
          configuration: "Debug"

      - name: "Build Reporting DB"
        uses: './.github/actions/buildProject'
        with:
          projectName: "ReportingDB"
          configuration: "Debug"
          buildProperties: "/p:BankingDatabaseName=BankingDB"

      - name: "Debug"
        run: tree

