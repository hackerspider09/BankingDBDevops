
name: Build SQL Project

on:
  workflow_call: 
    inputs:
      projectName:
        required: true
        type: string
        description: "Project path which needs to build"
      configuration:
        type: string
        default: "Debug"
        description: "SQL project should build in debug or release"


jobs:
  build_and_test:
    runs-on: windows-latest

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Build Banking DB"
        uses: './.github/actions/buildProject'
        with:
          projectName: "BankingDB"
          configuration: "Debug"

      - name: "Build Reporting DB"
        uses: './.github/actions/buildProject'
        with:
          projectName: "ReportingDB"
          configuration: "Debug"
          buildProperties: "/p:BankingDatabaseName=BankingDB"

      - name: "Debug"
        run: tree

