name: Release Pipeline

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3)"
        required: true
        type: string
jobs:
  # build_test:
  #   uses: "./.github/workflows/Build_and_Test_Projects.yaml"
  #   secrets: inherit
  #   with:
  #     configuration: "Release"

  build_pkg_project:
    # needs: build_test
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build BankingDB
        uses: './.github/actions/buildSQLProject'
        with:
          projectName: "BankingDB"
          configuration: "Release"

      - name: Build ReportingDB
        uses: './.github/actions/buildSQLProject'
        with:
          projectName: "ReportingDB"
          configuration: "Release"
          buildProperties: "/p:BankingDatabaseName=BankingDB"

      - name: Pack BankingDB NuGet
        run: |
          ./Build/Pack-DatabaseNuGet.ps1 `
            -ProjectName "BankingDB" `
            -Version "${{ inputs.version }}" `
            -Configuration "Release" `
            -OutputDir "./artifacts"

      - name: Pack ReportingDB NuGet
        run: |
          ./Build/Pack-DatabaseNuGet.ps1 `
            -ProjectName "ReportingDB" `
            -Version "${{ inputs.version }}" `
            -Configuration "Release" `
            -OutputDir "./artifacts"

      - name: "Debug"
        run: ls artifacts

      - name: Push a package to Octopus Deploy
        id: push_a_package_to_octopus_deploy
        uses: OctopusDeploy/push-package-action@v4
        env:
          OCTOPUS_URL: ${{ vars.OCTOPUS_FEED_URL }}
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_FEED_API_KEY }}
          OCTOPUS_SPACE: 'Default'
        with:
          overwrite_mode: OverwriteExisting
          packages: |
            artifacts/BankingDB.Package.${{ inputs.version }}.nupkg
            artifacts/ReportingDB.Package.${{ inputs.version }}.nupkg
