
name: Build Project
description: Build given Project to create dacpac

inputs:
  projectName:
    required: true
    description: "Project dir which has to build"
  configuration:
    description: "Config mode: Debug, Release"
    default: 'Debug'

runs:
  using: "composite"
  steps:
    - name: "Clean Project"
      # shell: pwsh
      run: ./Build/CleanProject.ps1 -ProjectName ${{inputs.projectName}} -Configuration ${{inputs.configuration}}
    